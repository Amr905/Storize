name: storize_data
description: Storize data layer (drift, settings, vault, gallery, logs).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  cryptography: ^2.9.0
  dio: ^5.11.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  logging: ^1.3.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  storize_domain: any
  storize_model: any
  storize_platform_android: any

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
