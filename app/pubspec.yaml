name: storize_app
description: Storize Android app (Instagram story and post auto-saver).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  # Exact pin: 6.1.5 pulls flutter_inappwebview_android 1.1.3, which breaks under AGP 9
  # (removed proguard-android.txt). Revisit when 6.2.0 stable ships.
  flutter_inappwebview: 6.2.0-beta.3
  material_ui: ^1.1.0
  storize_data: any
  storize_domain: any
  storize_instagram: any
  storize_model: any
  storize_platform_android: any

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
